services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: security-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      memsw:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    networks:
      - security-lab-net
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: security-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - security-lab-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  security-target-endpoint:
    image: ubuntu:22.04
    container_name: security-target-endpoint
    cap_add:
      - AUDIT
    security_opt:
      - no-new-privileges:true
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]
    networks:
      - security-lab-net
    depends_on:
      - elasticsearch

  security-dashboard:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: security-dashboard
    ports:
      - "8080:80"
    networks:
      - security-lab-net
    depends_on:
      - security-elasticsearch

networks:
  security-lab-net:
    driver: bridge
